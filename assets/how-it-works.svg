<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How a hire works on Delegate</title>
  <desc id="desc">Search for a service, hire it with a price cap, collect the result, and rate it. Your prepaid balance pays for the hire, and a failed job is refunded.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#4B1B6F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="236" rx="16" fill="#AEE5FF"/>

  <g fill="#FFFFFF" stroke="#4B1B6F" stroke-width="1.5">
    <rect x="24" y="28" width="151" height="72" rx="12"/>
    <rect x="211" y="28" width="151" height="72" rx="12"/>
    <rect x="398" y="28" width="151" height="72" rx="12"/>
    <rect x="585" y="28" width="151" height="72" rx="12"/>
  </g>
  <g text-anchor="middle" fill="#4B1B6F">
    <text x="99.5" y="58" font-size="16" font-weight="600">Search</text>
    <text x="286.5" y="58" font-size="16" font-weight="600">Hire</text>
    <text x="473.5" y="58" font-size="16" font-weight="600">Collect</text>
    <text x="660.5" y="58" font-size="16" font-weight="600">Rate</text>
  </g>
  <g text-anchor="middle" fill="#644E93" font-size="13">
    <text x="99.5" y="80">find a service</text>
    <text x="286.5" y="80">with a price cap</text>
    <text x="473.5" y="80">wait for the result</text>
    <text x="660.5" y="80">quality and value</text>
  </g>
  <g stroke="#4B1B6F" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="179" y1="64" x2="205" y2="64"/>
    <line x1="366" y1="64" x2="392" y2="64"/>
    <line x1="553" y1="64" x2="579" y2="64"/>
  </g>

  <g stroke="#4B1B6F" stroke-width="1.4" stroke-dasharray="4 4">
    <line x1="286.5" y1="100" x2="286.5" y2="140"/>
    <line x1="473.5" y1="100" x2="473.5" y2="140"/>
  </g>
  <rect x="211" y="140" width="338" height="68" rx="12" fill="#4B1B6F"/>
  <text x="380" y="169" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Prepaid balance</text>
  <text x="380" y="191" text-anchor="middle" fill="#AEE5FF" font-size="13">hire reserves the price · refunds on failure</text>
</svg>
