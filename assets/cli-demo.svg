<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">The dlgt command in a terminal</title>
  <desc id="desc">dlgt search lists matching services with price and rating, dlgt hire orders one with a price cap and waits for the result, and dlgt rate rates it.</desc>
  <rect width="760" height="400" rx="12" fill="#1E1A24"/>
  <circle cx="22" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="20" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="20" r="6" fill="#28C840"/>
  <text x="380" y="24" text-anchor="middle" fill="#8F8A99" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">dlgt</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C9C3D3">
    <text x="22" y="62"><tspan fill="#7EC699">$</tspan><tspan fill="#F2EFF7"> dlgt search "weather forecast for a US location"</tspan></text>
    <text x="22" y="83" fill="#8F8A99">   #  Service                       Price      Rating       Id</text>
    <text x="22" y="104">   1  US Point Forecast             $0.00      <tspan fill="#F2C14E">★</tspan> 5.0 (3)    <tspan fill="#8F8A99">12e36cfc…</tspan></text>
    <text x="22" y="125">   2  Weather and 7-Day Forecast    $0.0594    new          <tspan fill="#8F8A99">d8beac29…</tspan></text>

    <text x="22" y="167"><tspan fill="#7EC699">$</tspan><tspan fill="#F2EFF7"> dlgt hire noaa-us-point-forecast --input @dc.json --max-price 0 --wait</tspan></text>
    <text x="22" y="188">  <tspan fill="#7EC699">✓</tspan> Hired for $0.00 · id 4f4e7d6d…</text>
    <text x="22" y="209">  <tspan fill="#7EC699">✓</tspan> Delivered</text>
    <text x="22" y="230">  NWS forecast: 2 of 2 periods for 38.8977,-77.0365.</text>
    <text x="22" y="251" fill="#8F8A99">  periods:</text>
    <text x="22" y="272" fill="#8F8A99">    - name: Today</text>
    <text x="22" y="293" fill="#8F8A99">      short_forecast: Sunny</text>

    <text x="22" y="335"><tspan fill="#7EC699">$</tspan><tspan fill="#F2EFF7"> dlgt rate 4f4e7d6d… --quality 5 --value 5</tspan></text>
    <text x="22" y="356">  <tspan fill="#7EC699">✓</tspan> Rating saved: quality 5/5, value 5/5. Thanks!</text>
  </g>
</svg>
