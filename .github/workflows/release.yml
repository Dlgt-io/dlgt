name: Release

# A vX.Y.Z tag (gh release create vX.Y.Z) publishes @dlgt-io/sdk, @dlgt-io/cli
# and dlgt-io at that version. npm and PyPI trust this workflow directly
# (trusted publishing), so there are no tokens to leak or rotate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every package carries the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          fail() { echo "::error::$1 (tag is $version)"; exit 1; }
          for pkg in ts/sdk ts/cli; do
            [ "$(node -p "require('./$pkg/package.json').version")" = "$version" ] || fail "$pkg/package.json version differs"
          done
          [ "$(node -p "require('./ts/cli/package.json').dependencies['@dlgt-io/sdk']")" = "$version" ] || fail "the CLI's @dlgt-io/sdk dependency differs"
          grep -q "VERSION = \"$version\"" ts/sdk/src/index.ts || fail "VERSION in ts/sdk/src/index.ts differs"
          grep -q "^version = \"$version\"$" python/pyproject.toml || fail "python/pyproject.toml version differs"
          grep -q "__version__ = \"$version\"" python/src/dlgt_io/__init__.py || fail "__version__ in dlgt_io differs"

  npm:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci && npm test
        working-directory: ts
      # SDK first, since the CLI depends on it. A version already on npm (the
      # hand-published 0.1.0, or a re-run) is skipped, so re-running is safe.
      - name: Publish the SDK, then the CLI
        working-directory: ts
        run: |
          version="${GITHUB_REF_NAME#v}"
          for workspace in sdk cli; do
            name="$(node -p "require('./$workspace/package.json').name")"
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm"
            else
              npm publish --workspace "$workspace" --access public
            fi
          done

  pypi:
    needs: versions
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test and build
        working-directory: python
        run: |
          python -m unittest discover -s tests
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
          skip-existing: true
